spring.application.name=gmoney

spring.datasource.url=jdbc:mysql://localhost:3306/gmoney_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:aaa}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

gmoney.seed.enabled=true
gmoney.seed.admin.username=admin
gmoney.seed.admin.password=admin123

gmoney.forex.sync.enabled=true
gmoney.forex.sync.cron=0 30 16 * * MON-FRI
gmoney.forex.frankfurter.base-url=https://api.frankfurter.dev/v1

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

gmoney.jwt.secret=${JWT_SECRET:gmoney-local-dev-secret-change-me-0123456789abcdef}
