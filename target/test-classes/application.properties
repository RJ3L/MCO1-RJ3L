spring.application.name=gmoney

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

gmoney.seed.enabled=false
gmoney.seed.admin.username=admin
gmoney.seed.admin.password=admin123

gmoney.forex.sync.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.org.springframework.security=WARN

gmoney.jwt.secret=GMoneyTestOnlySigningKeyWithAtLeast32Bytes
